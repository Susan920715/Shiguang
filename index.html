<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f3ee"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><title>食光</title><style>
:root{--bg:#f7f3ee;--card:#fff;--ink:#292521;--muted:#8d837a;--accent:#c45d3d;--line:#eadfd6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:680px;margin:auto;padding:28px 18px 90px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}h1{font-size:30px;letter-spacing:2px;margin:0}h1 span{color:var(--accent)}button,.button{border:0;border-radius:14px;padding:11px 15px;background:var(--accent);color:white;font-weight:600;font-size:14px;cursor:pointer}button.ghost{background:#eee6df;color:var(--ink)}.sub{color:var(--muted);margin:3px 0 0}.stats{display:flex;gap:9px;margin:20px 0}.stat{background:var(--card);border-radius:16px;padding:13px;flex:1}.stat b{display:block;font-size:20px}.stat small{color:var(--muted)}input,textarea,select{width:100%;border:1px solid var(--line);background:#fffaf6;border-radius:12px;padding:12px;color:var(--ink);font:inherit}input[type=range]{padding:0;accent-color:var(--accent)}.filters{display:flex;gap:8px;align-items:center;margin:14px 0}.filters input{flex:1}.tabs button{padding:8px 11px;background:transparent;color:var(--muted)}.tabs button.active{background:#ead8cb;color:var(--accent)}.card{background:var(--card);border-radius:19px;margin:12px 0;padding:13px;display:flex;gap:14px;box-shadow:0 2px 12px #6d493312}.pic{width:92px;height:92px;object-fit:cover;border-radius:14px;background:#f2e4d9;display:grid;place-items:center;font-size:30px}.card h3{margin:3px 0 4px;font-size:17px}.meta{color:var(--muted);font-size:13px}.score{margin-left:auto;color:var(--accent);font-weight:700}.badge{display:inline-block;font-size:12px;padding:3px 8px;border-radius:20px;background:#f4eadf;color:#a85d43}.empty{text-align:center;color:var(--muted);padding:55px 20px}.ranking{background:var(--card);border-radius:19px;padding:16px;margin-top:24px}.ranking h2{font-size:18px;margin:0}.rank{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.rank:last-child{border-bottom:0}.rank span{flex:1;font-weight:600}.rank small{display:block;color:var(--muted);font-weight:400;font-size:12px}.rank strong{color:var(--accent);font-size:18px}.card-actions{display:flex;gap:7px;margin-top:9px}.card-actions button{padding:6px 10px;font-size:12px}.modal{position:fixed;inset:0;background:#241d1880;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{background:var(--bg);width:min(680px,100%);max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px}.sheet h2{margin:0 0 15px}.row{display:flex;gap:10px}.row>*{flex:1}.field{margin:11px 0}.field label{font-size:13px;color:var(--muted);display:block;margin:0 0 5px}.photo-preview{display:flex;gap:8px;overflow:auto}.photo-preview img{width:75px;height:75px;object-fit:cover;border-radius:10px}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}.actions button{flex:1}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
</style></head><body><main><header><div><h1>食<span>光</span></h1><p class="sub">把每一口，留在记忆里。</p></div><button id="add">＋ 记录</button></header><section class="stats"><div class="stat"><b id="eaten">0</b><small>已吃</small></div><div class="stat"><b id="wish">0</b><small>想吃</small></div><div class="stat"><b id="avg">—</b><small>平均评分</small></div></section><div class="filters"><input id="search" placeholder="搜索名称、品类或感受"><div class="tabs"><button class="active" data-filter="all">全部</button><button data-filter="wish">待吃</button><button data-filter="eaten">已吃</button></div></div><section id="list"></section><section class="ranking"><h2>🏆 评分排行榜</h2><p class="sub">已吃美食按评分从高到低</p><div id="rankingList"></div></section><div class="footer"><button class="ghost" id="export">导出备份</button>　数据仅保存在本设备</div></main><div class="modal" id="modal"><form class="sheet" id="form"><h2 id="formTitle">记录一份美味</h2><div class="field"><label>记录类型</label><select id="type"><option value="food">美食单品</option><option value="restaurant">餐厅</option></select></div><div class="field"><label>名称 *</label><input id="name" required placeholder="比如：桂满陇 / 豆乳盒子"></div><div class="field"><label>品类</label><input id="category" placeholder="比如：杭帮菜 / 甜品"></div><div class="row"><div class="field"><label>价格（元）</label><input id="price" inputmode="decimal" placeholder="可选"></div><div class="field"><label>状态</label><select id="status"><option value="wish">待吃</option><option value="eaten">已吃</option></select></div></div><div class="field"><label>照片（可多选）</label><input id="photos" type="file" accept="image/*" multiple><div class="photo-preview" id="preview"></div></div><div class="field"><label>就餐感受 / 备注</label><textarea id="notes" rows="3" placeholder="口味、环境、推荐菜……"></textarea></div><div class="field"><label>评分：<b id="ratingText">8.0</b> / 10</label><input id="rating" type="range" min="0" max="10" step="0.5" value="8"></div><div class="actions"><button type="button" class="ghost" id="cancel">取消</button><button>保存记录</button></div></form></div><script>
const key='shiguang.entries.v1'; let entries=JSON.parse(localStorage.getItem(key)||'[]'), filter='all', photos=[], editingId=null;
const $=s=>document.querySelector(s), save=()=>localStorage.setItem(key,JSON.stringify(entries));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const q=$('#search').value.toLowerCase();const shown=entries.filter(x=>(filter==='all'||x.status===filter)&&(`${x.name}${x.category}${x.notes}`).toLowerCase().includes(q));const eaten=entries.filter(x=>x.status==='eaten');$('#eaten').textContent=eaten.length;$('#wish').textContent=entries.length-eaten.length;$('#avg').textContent=eaten.length?(eaten.reduce((a,x)=>a+x.rating,0)/eaten.length).toFixed(1):'—';$('#list').innerHTML=shown.length?shown.map(x=>`<article class="card"><div class="pic">${x.photos?.[0]?`<img class="pic" src="${x.photos[0]}">`:'🍜'}</div><div style="flex:1"><div><span class="badge">${x.status==='eaten'?'已吃':'想吃'}</span> <span class="meta">${x.type==='restaurant'?'餐厅':'美食'}${x.category?' · '+esc(x.category):''}</span><span class="score">${x.status==='eaten'?x.rating.toFixed(1)+' / 10':''}</span></div><h3>${esc(x.name)}</h3><div class="meta">${x.price?'¥ '+esc(x.price)+'　':''}${esc(x.notes||'还没有写下感受')}</div><div class="card-actions"><button class="ghost edit" data-id="${x.id}">编辑</button><button class="ghost delete" data-id="${x.id}">删除</button></div></div></article>`).join(''):'<div class="empty">还没有记录<br>点击右上角，收藏下一顿美味。</div>';const ranked=[...eaten].sort((a,b)=>b.rating-a.rating).slice(0,5);$('#rankingList').innerHTML=ranked.length?ranked.map((x,i)=>`<div class="rank"><b>${['🥇','🥈','🥉','4','5'][i]}</b><span>${esc(x.name)}<small>${x.category?esc(x.category):'美食'}</small></span><strong>${x.rating.toFixed(1)}</strong></div>`).join(''):'<p class="empty">吃过并评分后，这里会出现你的美食榜单。</p>';document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>openEdit(b.dataset.id));document.querySelectorAll('.delete').forEach(b=>b.onclick=()=>remove(b.dataset.id));}
function openNew(){editingId=null;photos=[];$('#form').reset();$('#formTitle').textContent='记录一份美味';$('#preview').innerHTML='';$('#ratingText').textContent='8.0';$('#modal').classList.add('show')}
function openEdit(id){const x=entries.find(e=>e.id===id);if(!x)return;editingId=id;photos=x.photos||[];$('#formTitle').textContent='编辑记录';['type','name','category','price','status','notes','rating'].forEach(k=>$('#'+k).value=x[k]);$('#ratingText').textContent=Number(x.rating).toFixed(1);$('#preview').innerHTML=photos.map(p=>`<img src="${p}">`).join('');$('#modal').classList.add('show')}
function remove(id){const x=entries.find(e=>e.id===id);if(x&&confirm(`确定删除“${x.name}”吗？`)){entries=entries.filter(e=>e.id!==id);save();render()}}
$('#add').onclick=openNew;$('#cancel').onclick=()=>$('#modal').classList.remove('show');$('#search').oninput=render;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});$('#rating').oninput=e=>$('#ratingText').textContent=Number(e.target.value).toFixed(1);$('#photos').onchange=e=>{for(const f of [...e.target.files].slice(0,6)){const r=new FileReader();r.onload=()=>{photos.push(r.result);$('#preview').innerHTML=photos.map(x=>`<img src="${x}">`).join('')};r.readAsDataURL(f)}};$('#form').onsubmit=e=>{e.preventDefault();const data={id:editingId||crypto.randomUUID(),type:$('#type').value,name:$('#name').value.trim(),category:$('#category').value.trim(),price:$('#price').value.trim(),status:$('#status').value,rating:Number($('#rating').value),notes:$('#notes').value.trim(),photos,date:new Date().toISOString()};if(!data.name)return;if(editingId)entries=entries.map(x=>x.id===editingId?{...x,...data}:x);else entries.unshift(data);save();$('#modal').classList.remove('show');render()};$('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(entries,null,2)],{type:'application/json'}));a.download='食光备份.json';a.click()};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
